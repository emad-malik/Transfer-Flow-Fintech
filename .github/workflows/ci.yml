name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meowpay
          POSTGRES_PASSWORD: meowpay
          POSTGRES_DB: meowpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meowpay -d meowpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://meowpay:meowpay@localhost:5432/meowpay_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Test (pytest, against real Postgres)
        working-directory: backend
        run: pytest
